<aside class="min-w-0 space-y-3 rounded-2xl border border-zinc-800 bg-zinc-900 p-5 lg:self-start">
  <div class="mb-6">
    <h2 class="text-lg font-semibold">Effect Settings</h2>

    <p class="mt-1 text-sm text-zinc-400">Customize your artwork</p>
  </div>

  <app-mask class="block"></app-mask>
  <app-motion class="block" (stopAnimation)="onStopAnimation()"></app-motion>
  <app-animation
    class="block"
    [videoSettings]="videoSettings()"
    [isPlaying]="isPlaying()"
    (stopAnimation)="onStopAnimation()"
    (playAnimation)="onPlayAnimation()"
    (updateVideoSettings)="onUpdateVideoSettings($event)"
  ></app-animation>
  <app-export
    class="block"
    [videoSettings]="videoSettings()"
    (updateVideoSettings)="onUpdateVideoSettings($event)"
    (stopAnimation)="onStopAnimation()"
  ></app-export>

</aside>
