<div   class="relative mx-auto flex max-h-[70vh] w-full
         items-center justify-center overflow-hidden
         rounded-xl bg-zinc-950">
  <!-- Keep your existing canvas here -->
  <canvas
  #canvas
  class="block h-auto max-h-[70vh] max-w-full object-contain"
></canvas>

  @if (showPlayerControls) {
    <div
      class="absolute inset-x-3 bottom-3 z-20 rounded-xl border border-white/10 bg-zinc-950/85 p-3 text-white shadow-2xl backdrop-blur-md"
    >
      <!-- Seek bar -->
      <input
        type="range"
        min="0"
        max="1000"
        step="1"
        class="mb-3 w-full cursor-pointer accent-cyan-400"
        [value]="progress * 1000"
        (input)="onSeek($event)"
        aria-label="Seek animation"
      />

      <!-- Player buttons -->
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="rounded-lg p-2 hover:bg-white/10"
          (click)="togglePlayback()"
          [attr.aria-label]="isPlaying ? 'Pause' : 'Play'"
        >
          @if (isPlaying) {
            <span>⏸</span>
          } @else {
            <span>▶</span>
          }
        </button>

        <button
          type="button"
          class="rounded-lg p-2 hover:bg-white/10"
          (click)="replayRequested.emit()"
          aria-label="Replay animation"
        >
          ↺
        </button>

        <span class="text-xs tabular-nums text-zinc-300">
          {{ formatTime(currentTime) }}
          /
          {{ formatTime(durationSeconds) }}
        </span>

        <div class="flex-1"></div>
      </div>
    </div>
  }
</div>
